<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VectorAlpha</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f4e8c'/%3E%3Cpath d='M9 22V14M16 22V9M23 22V12' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/web/common.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><path d="M9 22V14M16 22V9M23 22V12" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
      <div><b>VectorAlpha</b><span>Backtesting workbench</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button class="side-data" id="side-data" title="Open data settings"></button>
      <div class="side-status" id="side-status"><span class="dot"></span>Idle</div>
      <div class="theme" role="group" aria-label="Theme"><button data-theme="light">Light</button><button data-theme="dark">Dark</button></div>
    </div>
  </aside>

  <main class="content">
    <div class="page-head"><h1 id="page-title"></h1><p id="page-sub"></p></div>
    <section class="view" id="view-run" hidden></section>
    <section class="view" id="view-history" hidden></section>
    <section class="view" id="view-strategies" hidden></section>
    <section class="view" id="view-tickers" hidden></section>
    <section class="view" id="view-compiler" hidden></section>
    <section class="view" id="view-checks" hidden></section>
    <section class="view" id="view-data" hidden></section>
  </main>
</div>

<div class="console" id="console">
  <button class="console-bar" id="console-toggle">
    <span class="dot" id="console-dot"></span><span id="console-title">Job console</span>
    <span class="grow"></span><span class="muted small" id="console-hint">Output of runs, builds and checks appears here</span>
    <span class="chev" id="console-chev"></span>
  </button>
  <div class="console-body">
    <pre id="console-log"></pre>
    <div class="console-tools"><button class="btn sm" id="console-clear">Clear</button></div>
  </div>
</div>
<script src="/web/common.js"></script>
<script src="/web/app.js"></script>
</body>
</html>
